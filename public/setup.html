<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MODIFY · First administrator setup</title>
<style>body{margin:0;background:#090a0c;color:#f5f1e7;font:15px system-ui;min-height:100vh;display:grid;place-items:center;padding:18px;box-sizing:border-box}.box{width:min(440px,100%);box-sizing:border-box;background:#1a1c20;border:1px solid #c6a34a;border-radius:15px;padding:24px}h1{margin:0 0 8px}p{color:#b8b5ac;font-size:13px}label{display:block;color:#e0c477;font-size:12px;margin:13px 0 5px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #48443a;border-radius:8px;background:#111317;color:#fff}button{margin-top:18px;width:100%;padding:12px;background:#c6a34a;border:0;border-radius:8px;font-weight:750}#result{white-space:pre-wrap;color:#e0c477}</style></head>
<body><main class="box"><h1>MODIFY Construction</h1><h2>First administrator setup</h2><p>Use this page once to create the first administrator account. The bootstrap key is a temporary secret you add in Cloudflare. Do not share it.</p>
<form id="setup"><label>Temporary setup key</label><input name="key" type="password" required><label>Administrator full name</label><input name="name" required maxlength="100"><label>Administrator staff code</label><input name="staffCode" required maxlength="40"><label>Personal six-digit PIN</label><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><button>Create administrator</button></form><p id="result" role="status"></p></main>
<script>document.getElementById("setup").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget),out=document.getElementById("result");out.textContent="Creating account…";try{const r=await fetch("/api/setup/first-admin",{method:"POST",headers:{"content-type":"application/json","x-bootstrap-key":String(f.get("key"))},body:JSON.stringify({name:f.get("name"),staffCode:f.get("staffCode"),pin:f.get("pin")})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Setup failed");out.textContent="Administrator created. Now remove the BOOTSTRAP_KEY secret in Cloudflare, then go to the main website and sign in.";e.currentTarget.reset()}catch(err){out.textContent=err.message}});</script></body></html>
